name: Release in npm

permissions:
  id-token: write # Required for OIDC
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake git python3 python3-pip python3-venv ninja-build clang lld llvm-dev

      - name: Install Meson and Ninja (pip)
        run: python3 -m pip install --upgrade meson ninja

      - name: Install Rust toolchain and wasm target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Clone xcdat-trie
        run: git clone https://github.com/f3liz-dev/xcdat-trie.git xcdat-trie

      - name: Build and install xcdat-trie
        env:
          XCDAT_PREFIX: ${{ github.workspace }}/xcdat-install
        run: |
          set -e
          cd xcdat-trie
          meson setup builddir --prefix="$XCDAT_PREFIX"
          meson compile -C builddir
          meson install -C builddir
          echo "Installed files:"
          ls -la "$XCDAT_PREFIX/bin" || true

      - name: Build sudachi-xcdat-compress
        # sudachi-xcdat-compress is defined in the `sudachi-cli` crate
        working-directory: sudachi-cli
        run: cargo build --release --bin sudachi-xcdat-compress

      - name: Download and convert all dictionaries to .xdic
        env:
          XCDAT_BUILD_BIN: ${{ github.workspace }}/xcdat-install/bin/xcdat_build
          XCDAT_ENUMERATE_BIN: ${{ github.workspace }}/xcdat-install/bin/xcdat_enumerate
        run: |
          set -e
          mkdir -p artifacts

          # Convert small dictionary
          echo "Processing small dictionary..."
          bash fetch_dictionary.sh "latest" "small"
          target/release/sudachi-xcdat-compress resources/system.dic -o artifacts/system_small.xdic

          # Convert core dictionary
          echo "Processing core dictionary..."
          bash fetch_dictionary.sh "latest" "core"
          target/release/sudachi-xcdat-compress resources/system.dic -o artifacts/system_core.xdic

          # Convert full dictionary
          echo "Processing full dictionary..."
          bash fetch_dictionary.sh "latest" "full"
          target/release/sudachi-xcdat-compress resources/system.dic -o artifacts/system_full.xdic

          ls -lh artifacts/

      - name: Build wasm artifact (sudachi-wasm)
        run: |
          set -e
          source $HOME/.cargo/env || true
          # build the sudachi-wasm package for the wasm32-unknown-unknown target
          cargo build --release --target wasm32-unknown-unknown -p sudachi-wasm
          mkdir -p artifacts
          # copy any produced wasm into artifacts
          cp -v target/wasm32-unknown-unknown/release/*.wasm artifacts/
          ls -la artifacts

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.114

      - name: Generate npm package with wasm-bindgen
        run: |
          set -e
          source $HOME/.cargo/env || true
          cd sudachi-wasm
          wasm-bindgen ../target/wasm32-unknown-unknown/release/sudachi_wasm.wasm \
            --out-dir pkg \
            --target web \
            --typescript
          # Copy package.json to pkg directory
          cp package.json pkg/
          ls -la pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcdat-artifacts
          path: |
            artifacts/*.xdic
            artifacts/*.wasm

      - name: Create GitHub Release with xdic files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/system_small.xdic
            artifacts/system_core.xdic
            artifacts/system_full.xdic
          draft: false
          prerelease: false

      - uses: actions/setup-node@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      - name: Publish to npm with OIDC (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: sudachi-wasm
        run: npm publish

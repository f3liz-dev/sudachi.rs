[package]
name = "sudachi-wasm-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sudachi = { path = "../sudachi", default-features = false }
zstd = { version = "0.13", default-features = false, features = ["no_asm"] }

[profile.release]
opt-level = "z"
lto = true

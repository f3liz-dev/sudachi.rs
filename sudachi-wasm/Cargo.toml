[package]
name = "sudachi-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
sudachi = { path = "../sudachi", default-features = false }
wasm-bindgen = "0.2"
zstd = { version = "0.13", default-features = false, features = ["no_asm"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
